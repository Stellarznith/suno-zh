<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Suno localization — synthetic fixture (v0.2.0)</title>
<style>
  body { font: 15px system-ui; background: #141418; color: #eee; margin: 28px auto; max-width: 1120px; }
  a { color: #f4a574; margin-right: 12px; text-decoration: none; }
  button, input, textarea { font: inherit; padding: 8px 12px; margin: 6px 6px 6px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; }
  section, aside, article { border: 1px solid #3c3c44; padding: 18px; margin: 14px 0; border-radius: 12px; background: #1b1b20; }
  label, span { margin-right: 10px; }
  textarea, [contenteditable] { background: #2a2a32; color: #fff; padding: 10px; width: 100%; box-sizing: border-box; }
  [role="menu"], [role="listbox"], [role="dialog"] { background: #25252d; border: 1px solid #555; padding: 12px; border-radius: 10px; margin-top: 8px; }
  .routes { margin-bottom: 12px; font-size: 13px; color: #aaa; }
</style>

<h1>本地合成预览页 · 无真实账户数据（v0.2.0）</h1>
<div class="routes">
  快捷切换模拟路由：
  <a href="/create">/create</a>
  <a href="/create/visuals">/create/visuals</a>
  <a href="/me">/me</a>
  <a href="/discover">/discover</a>
  <a href="/song/synthetic">/song/synthetic</a>
  <a href="/studio">/studio</a>
</div>
<aside id="userscript-menu"></aside>
<nav>
  <a href="/discover">Home</a>
  <a href="/explore">Explore</a>
  <a href="/create">Create</a>
  <a href="/studio">Studio</a>
  <a href="/me" data-testid="navbar-library-tab">Library</a>
  <a href="/earn-credits">Earn credits</a>
  <a href="/labs">Labs</a>
  <button aria-label="Notifications">Notifications</button>
  <button>More</button>
  <a href="/account?source=sideNav&plan_key=premier">Upgrade to Premier</a>
</nav>
<main id="main"></main>

<script>
window.GM_getValue = (k, d) => JSON.parse(localStorage.getItem(k) ?? JSON.stringify(d));
window.GM_setValue = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const menuIds = new Map();
let seq = 1;
window.GM_unregisterMenuCommand = id => {
  const el = menuIds.get(id);
  if (el) el.remove();
  menuIds.delete(id);
};
window.GM_registerMenuCommand = (label, callback) => {
  const id = seq++;
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = callback;
  document.getElementById('userscript-menu').append(b);
  menuIds.set(id, b);
  return id;
};

const main = document.getElementById('main');
const path = location.pathname;

if (path === '/create/visuals') {
  main.innerHTML = `
    <section>
      <div role="tablist" aria-label="What to create">
        <button role="tab">Songs</button>
        <button role="tab">Speech</button>
        <button role="tab">Sounds</button>
        <button role="tab" aria-selected="true">Visuals</button>
      </div>
      <div role="tablist" aria-label="Image or video">
        <button role="tab">Image</button>
        <button role="tab" aria-selected="true">Video</button>
      </div>
      <button role="combobox" aria-label="Model">Fast</button>
      <textarea placeholder="Describe your video in detail"></textarea>
      <p>Type a prompt or add a frame, image or song to start.</p>
      <button>Clear</button>
      <button>Create 10s clip</button>
      <span>150 credits</span>
    </section>`;
} else if (path === '/create') {
  main.innerHTML = `
    <section>
      <div role="tablist" aria-label="What to create">
        <button role="tab" aria-selected="true">Songs</button>
        <button role="tab">Speech</button>
        <button role="tab">Sounds</button>
        <button role="tab">Visuals</button>
      </div>
      <span role="tablist" aria-label="Create form mode">
        <button role="tab" aria-label="Simple">Simple</button>
        <button role="tab" aria-label="Advanced" aria-selected="true">Advanced</button>
      </span>
      <button>Audio</button>
      <button>Voice</button>
      <button>Inspo</button>
      <h2>Lyrics</h2>
      <div role="textbox" aria-label="Lyrics editor" contenteditable="true">Create</div>
      <h2>Styles</h2>
      <div data-testid="create-form-styles-wrapper">
        <textarea aria-label="Styles" placeholder="Describe style">Styles</textarea>
      </div>
      <div role="button" tabindex="0" id="options">More Options</div>
      <div id="advanced" hidden>
        <input placeholder="Exclude styles" value="metal">
        <span>Vocal Gender</span>
        <button>Male</button>
        <button>Female</button>
        <span>Weirdness</span>
        <span>Style Influence</span>
        <span>Variety</span>
        <span>Personalize</span>
        <button>My taste</button>
      </div>
      <input placeholder="Song Title (Optional)" value="">
      <button disabled>Create</button>
    </section>
    <section role="group" aria-label="Library section">
      <h2>My Songs</h2>
      <input placeholder="Search clips" value="">
      <button id="sort" role="combobox" aria-label="Sort by Newest" aria-controls="sort-list">Sort by Newest</button>
      <div data-testid="clip-row" role="group" aria-label="Create">
        <h4><a href="/song/synthetic">Create</a></h4>
        <button aria-label="Share clip">Share</button>
      </div>
    </section>`;
  document.getElementById('options').onclick = () => {
    document.getElementById('advanced').hidden = !document.getElementById('advanced').hidden;
  };
} else if (path === '/song/synthetic') {
  main.innerHTML = `
    <article>
      <h1>Create</h1>
      <a href="/@synthetic">Author</a>
      <button>Follow</button>
      <button>Play</button>
      <span>12 Comments</span>
      <h2>Lyrics</h2>
      <p>Follow me into the night, Share this dream</p>
      <button>... More</button>
      <h2>Styles</h2>
      <a href="/style/synthwave">synthwave</a>
      <h2>More by Alice</h2>
      <h2>Similar songs</h2>
      <h2>Comments</h2>
      <input placeholder="Write a comment" value="">
    </article>`;
} else if (path === '/discover') {
  main.innerHTML = `
    <section>
      <input type="search" aria-label="Search" placeholder="Search">
      <input placeholder="Describe the song you want to make" value="">
      <button>Create</button>
      <button>Try Visuals</button>
      <h2>For You</h2>
      <h2>Staff Picks</h2>
      <h2>Best of v6</h2>
    </section>`;
} else if (path === '/studio') {
  main.innerHTML = `
    <section>
      <h2>Untitled Project</h2>
      <button>Upgrade to edit</button>
      <button>Undo</button>
      <button>Redo</button>
      <button>Play</button>
      <button>Export</button>
      <button>Add new track</button>
    </section>`;
} else {
  main.innerHTML = `
    <div role="tablist">
      <a role="tab" href="/me">Songs</a>
      <a role="tab" href="/me/playlists">Playlists</a>
      <a role="tab" href="/me/albums">Albums</a>
      <a role="tab" href="/me/workspaces">Workspaces</a>
      <a role="tab" href="/me/studio-projects">Studio Projects</a>
      <a role="tab" href="/me/hooks">Hooks</a>
      <a role="tab" href="/me/history">History</a>
    </div>
    <input aria-label="Search" placeholder="Search" value="Create">
    <button id="filter" role="combobox" aria-label="Filters (2)" aria-controls="filter-popup">Filters (2)</button>
    <div role="group" aria-label="Create">
      <h4><a href="/song/synthetic">Create</a></h4>
      <button id="more" aria-label="More options">⋯</button>
    </div>`;
  document.getElementById('filter').onclick = () => {
    const old = document.getElementById('filter-popup');
    if (old) { old.remove(); return; }
    const e = document.createElement('div');
    e.id = 'filter-popup';
    e.setAttribute('role', 'listbox');
    e.innerHTML = '<div role="option">Public</div><div role="option">Private</div><div role="option">Hide Stems</div>';
    document.body.append(e);
  };
  document.getElementById('more').onclick = () => {
    const old = document.getElementById('menu');
    if (old) { old.remove(); return; }
    const e = document.createElement('div');
    e.id = 'menu';
    e.setAttribute('role', 'menu');
    e.innerHTML = '<button role="menuitem">Remix</button><button role="menuitem">Edit</button><button role="menuitem">Share</button><button role="menuitem">Download</button><button role="menuitem">Move to trash</button>';
    document.body.append(e);
  };
}
</script>
<script src="/suno-zh.js"></script>
</html>
